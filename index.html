        const DIALOGUES = [
          {
            title: "Text 1: 在饭馆，杨同乐请同事吃饭",
            lines: [
              { hanzi: "杨同乐：今天我请客，你们想吃什么就点什么！", pinyin: "Yáng Tónglè: Jīntiān wǒ qǐngkè, nǐmen xiǎng chī shénme jiù diǎn shénme!", uzb: "Yang Tongle: Bugun men mehmon qilyapman, nima xohlasangiz shuni buyurtma qiling!", rus: "Ян Тонглэ: Сегодня я угощаю, заказывайте что хотите!", eng: "Yang Tongle: Today I'm treating, order whatever you want to eat!" },
              { hanzi: "王一雪：那我就不客气了。听说这家饭馆的鱼做得很特别？", pinyin: "Wáng Yīxuě: Nà wǒ jiù bú kèqi le. Tīngshuō zhè jiā fànguǎn de yú zuò de hěn tèbié?", uzb: "Wang Yixue: Unda men tortinib o'tirmayman. Eshitishimcha, bu restoranda baliq juda o'zgacha tayyorlanar ekan?", rus: "Ван Исюэ: Тогда я не буду стесняться. Слышала, что в этом ресторане рыбу готовят по-особенному?", eng: "Wang Yixue: Then I won't be polite. I heard the fish in this restaurant is made very specially?" },

              { hanzi: "王一雪：好，那先来这几个菜。对了，下周我儿子过生日，你们有时间的话，就来我家做客，我给你们做北京菜。", pinyin: "Wáng Yīxuě: Hǎo, nà xiān lái zhè jǐ ge cài. Duìle, xià zhōu wǒ érzi guò shēngrì, nǐmen yǒu shíjiān de huà, jiù lái wǒ jiā zuòkè, wǒ gěi nǐmen zuò Běijīng cài.", uzb: "Wang Yixue: Yaxshi, hozircha shu taomlarni keltirsin. Aytgancha, kelasi hafta o'g'limning tug'ilgan kuni, agar vaqtingiz bo'lsa, uyimizga mehmonga kelinglar, men sizlarga Pekin taomlarini tayyorlab beraman.", rus: "Ван Исюэ: Хорошо, пусть сначала принесут эти блюда. Кстати, на следующей неделе у моего сына день рождения, если у вас будет время, приходите в гости, я приготовлю вам пекинские блюда.", eng: "Wang Yixue: OK, let's have these dishes first. By the way, next week is my son's birthday. If you have time, come be guests at my house, I will cook Beijing dishes for you." }
            ]

            lines: [
              { hanzi: "王一雪：第一次请新邻居来做客，总是担心有什么没准备好。", pinyin: "Wáng Yīxuě: Dì yī cì qǐng xīn línjū lái zuòkè, zǒngshì dānxīn yǒu shénme méi zhǔnbèi hǎo.", uzb: "Wang Yixue: Yangi qo'shnilarni birinchi marta mehmonga chaqirish, nimanidir tayyorlamay qolishdan doim xavotirlanaman.", rus: "Ван Исюэ: Впервые приглашаю новых соседей в гости, всегда беспокоюсь, что что-то не готово.", eng: "Wang Yixue: Inviting new neighbors over for the first time, I always worry that something isn't well prepared." },
              { hanzi: "刘明：放心吧，我帮你看了，都已经准备好了。", pinyin: "Liú Míng: Fàngxīn ba, wǒ bāng nǐ kàn le, dōu yǐjīng zhǔnbèi hǎo le.", uzb: "Liu Ming: Xotirjam bo'l, men senga qarab chiqdim, hammasi tayyor.", rus: "Лю Мин: Успокойся, я посмотрел, уже всё готово.", eng: "Liu Ming: Feel at ease, I checked for you, everything is already prepared." },
              { hanzi: "王一雪：我记得刚才已经把饮料拿出来了，怎么不见了？", pinyin: "Wáng Yīxuě: Wǒ jìde gāngcái yǐjīng bǎ yǐnliào ná chūlái le, zěnme bú jiàn le?", uzb: "Wang Yixue: Esimda, hozirgina ichimliklarni olib chiqqandim, qayerga g'oyib bo'ldi?", rus: "Ван Исюэ: Я помню, что только что достала напитки, куда они пропали?", eng: "Wang Yixue: I remember I just took out the drinks, why are they gone?" },
              { hanzi: "刘明：我把饮料和酒都放进冰箱里了，客人来了再拿出来。", pinyin: "Liú Míng: Wǒ bǎ yǐnliào hé jiǔ dōu fàng jìn bīngxiāng lǐ le, kèrén lái le zài ná chūlái.", uzb: "Liu Ming: Men ichimliklar va sharobni muzlatgichga qo'ydim, mehmonlar kelgach olib chiqamiz.", rus: "Лю Мин: Я положил напитки и вино в холодильник, достанем, когда придут гости.", eng: "Liu Ming: I put the drinks and wine in the fridge, we'll take them out when the guests arrive." },
              { hanzi: "王一雪：音乐的声音合适吗？", pinyin: "Wáng Yīxuě: Yīnyuè de shēngyīn héshì ma?", uzb: "Wang Yixue: Musiqa ovozi mosmi?", rus: "Ван Исюэ: Звук музыки подходящий?", eng: "Wang Yixue: Is the music volume appropriate?" },
              { hanzi: "刘明：你把声音开得太大了，我去关小一点儿。", pinyin: "Liú Míng: Nǐ bǎ shēngyīn kāi de tài dà le, wǒ qù guān xiǎo yìdiǎnr.", uzb: "Liu Ming: Sen ovozni juda baland qilib yuboribsan, borib sal pasaytirib qo'yaman.", rus: "Лю Мин: Ты включила звук слишком громко, я пойду немного убавлю.", eng: "Liu Ming: You turned the volume up too high, I'll go turn it down a bit." },
              { hanzi: "王一雪：好，那我们就等客人来吧。", pinyin: "Wáng Yīxuě: Hǎo, nà wǒmen jiù děng kèrén lái ba.", uzb: "Wang Yixue: Yaxshi, unda mehmonlarni kutamiz.", rus: "Ван Исюэ: Хорошо, тогда будем ждать гостей.", eng: "Wang Yixue: OK, then we will just wait for the guests to come." }
            ]
          },
          {
            title: "Text 3: 在家里，王一雪和刘明办生日会",
            lines: [
              { hanzi: "王一雪：谢谢你们来参加我儿子的生日晚会，希望大家今晚玩得开心。", pinyin: "Wáng Yīxuě: Xièxie nǐmen lái cānjiā wǒ érzi de shēngrì wǎnhuì, xīwàng dàjiā jīn wǎn wán de kāixīn.", uzb: "Wang Yixue: O'g'limning tug'ilgan kuni kechasiga kelganingiz uchun rahmat, umid qilamanki, hamma bugun kechqurun vaqtini chog' o'tkazadi.", rus: "Ван Исюэ: Спасибо, что пришли на вечеринку по случаю дня рождения моего сына, надеюсь, все сегодня хорошо повеселятся.", eng: "Wang Yixue: Thank you for coming to my son's birthday party, I hope everyone has a good time tonight." },
              { hanzi: "杨同乐：小明，生日快乐！我准备了一个小礼物，希望你喜欢！", pinyin: "Yáng Tónglè: Xiǎomíng, shēngrì kuàilè! Wǒ zhǔnbèi le yí ge xiǎo lǐwù, xīwàng nǐ xǐhuan!", uzb: "Yang Tongle: Xiaoming, tug'ilgan kuning bilan! Kichkina sovg'a tayyorlagandim, senga yoqadi deb umid qilaman!", rus: "Ян Тонглэ: Сяомин, с днем рождения! Я приготовил небольшой подарок, надеюсь, тебе понравится!", eng: "Yang Tongle: Xiaoming, happy birthday! I prepared a small gift, I hope you like it!" },
              { hanzi: "刘小明：谢谢您，我可以打开吗？", pinyin: "Liú Xiǎomíng: Xièxie nín, wǒ kěyǐ dǎkāi ma?", uzb: "Liu Xiaoming: Rahmat, uni ochib ko'rsam bo'ladimi?", rus: "Лю Сяомин: Спасибо, можно я открою?", eng: "Liu Xiaoming: Thank you, may I open it?" },
              { hanzi: "杨同乐：当然可以，你妈妈说你跟姐姐一样，都喜欢画画，对吗？", pinyin: "Yáng Tónglè: Dāngrán kěyǐ, nǐ māma shuō nǐ gēn jiějie yíyàng, dōu xǐhuan huàhuà, duì ma?", uzb: "Yang Tongle: Albatta mumkin, oying aytishicha, sen ham opang kabi rasm chizishni yaxshi ko'rarkan san, shundaymi?", rus: "Ян Тонглэ: Конечно можно, твоя мама сказала, что ты, как и сестра, любишь рисовать, верно?", eng: "Yang Tongle: Of course you can, your mom said you, like your sister, both like to draw, right?" },
              { hanzi: "刘小明：对，我想做一名画家。啊！画板和画笔，这正是我需要的。我太喜欢了。", pinyin: "Liú Xiǎomíng: Duì, wǒ xiǎng zuò yī míng huàjiā. A! Huàbǎn hé huàbǐ, zhè zhèng shì wǒ xūyào de. Wǒ tài xǐhuan le.", uzb: "Liu Xiaoming: Ha, men rassom bo'lmoqchiman. Oh! Molbert va mo'yqalam, aynan menga kerakli narsalar. Menga juda yoqdi.", rus: "Лю Сяомин: Да, я хочу стать художником. Ах! Мольберт и кисти, это именно то, что мне нужно. Мне очень нравится.", eng: "Liu Xiaoming: Yes, I want to be a painter. Ah! Drawing board and brushes, this is exactly what I needed. I like it so much." },
              { hanzi: "王一雪：我去把盘子拿过来，咱们一边吃蛋糕，一边聊天儿吧。", pinyin: "Wáng Yīxuě: Wǒ qù bǎ pánzi ná guòlái, zánmen yìbiān chī dàngāo, yìbiān liáotiānr ba.", uzb: "Wang Yixue: Men borib likopchalarni olib kelay, kelinglar, bir vaqtning o'zida ham tort yeb, ham suhbatlashamiz.", rus: "Ван Исюэ: Я пойду принесу тарелки, давайте есть торт и одновременно болтать.", eng: "Wang Yixue: I'll go get the plates, let's eat cake and chat at the same time." }
            ]
          },
          {
            title: "Text 4: 在家里，王一雪在写日记",
            lines: [
              { hanzi: "我的新邻居是来自英国的夫妻。上周我去他们家做客了。他们做了很多好吃的，还准备了英国的红茶。", pinyin: "Wǒ de xīn línjū shì láizì Yīngguó de fūqī. Shàng zhōu wǒ qù tāmen jiā zuòkè le. Tāmen zuò le hěn duō hǎochī de, hái zhǔnbèi le Yīngguó de hóngchá.", uzb: "Mening yangi qo'shnilarim Angliyadan kelgan er-xotin. O'tgan hafta men ularning uyiga mehmonga bordim. Ular ko'plab mazali taomlar tayyorlashdi va ingliz qora choyini ham damlashdi.", rus: "Мои новые соседи - супружеская пара из Великобритании. На прошлой неделе я ходила к ним в гости. Они приготовили много вкусной еды, а также английский черный чай.", eng: "My new neighbors are a couple from the UK. Last week I went to their house as a guest. They made a lot of delicious food and also prepared British black tea." },
              { hanzi: "那天我跟他们一边喝红茶，一边聊天儿，直到十二点多才回家。", pinyin: "Nàtiān wǒ gēn tāmen yìbiān hē hóngchá, yìbiān liáotiānr, zhídào shí'èr diǎn duō cái huí jiā.", uzb: "O'sha kuni men ular bilan qora choy ichib suhbatlashdim va kech soat o'n ikkilargacha uyga qaytmadim.", rus: "В тот день я пила с ними черный чай и болтала, и вернулась домой только после двенадцати.", eng: "That day I drank black tea and chatted with them, and didn't go home until after twelve o'clock." },
              { hanzi: "他们年轻的时候喜欢旅游，他家有一张世界地图，上面每一个红点都是他们去过的地方。", pinyin: "Tāmen niánqīng de shíhou xǐhuan lǚyóu, tā jiā yǒu yì zhāng shìjiè dìtú, shàngmiàn měi yí ge hóng diǎn dōu shì tāmen qù guò de dìfāng.", uzb: "Ular yoshliklarida sayohat qilishni yaxshi ko'rishgan, ularning uyida jahon xaritasi bor, undagi har bir qizil nuqta ular borgan joylarni bildiradi.", rus: "В молодости они любили путешествовать, у них дома есть карта мира, на которой каждая красная точка - это место, где они были.", eng: "When they were young they liked to travel. They have a world map in their house, and every red dot on it is a place they have been to." },
              { hanzi: "后来，他们感到东方的文化很特别，就开始学习中文。", pinyin: "Hòulái, tāmen gǎndào dōngfāng de wénhuà hěn tèbié, jiù kāishǐ xuéxí Zhōngwén.", uzb: "Keyinchalik, ular Sharq madaniyatining juda o'zgachaligini his qilishdi va xitoy tilini o'rganishni boshlashdi.", rus: "Позже они почувствовали, что восточная культура очень особенная, и начали изучать китайский язык.", eng: "Later, they felt that Eastern culture was very special, and started learning Chinese." },
              { hanzi: "今天是小明的生日，我请他们到我家玩，来看看中国人的家，也尝尝中国菜。", pinyin: "Jīntiān shì Xiǎomíng de shēngrì, wǒ qǐng tāmen dào wǒ jiā wán, lái kànkan Zhōngguórén de jiā, yě chángchang Zhōngguó cài.", uzb: "Bugun Xiaomingning tug'ilgan kuni, men ularni uyimizga taklif qildim, xitoylarning uyini ko'rishlari va xitoy taomlaridan tatib ko'rishlari uchun.", rus: "Сегодня день рождения Сяомина, я пригласила их к нам домой, чтобы они посмотрели на дом китайцев и тоже попробовали китайскую еду.", eng: "Today is Xiaoming's birthday, I invited them to my house to visit, to see a Chinese person's home, and also taste Chinese food." }
            ]

          {

          {

            uzb: "Bir vaqtning o'zida sodir bo'layotgan ikkita harakatni ifodalaydi. (Ham..., ham...)",
            rus: "Сложносочиненное предложение «одновременно... и...».",
            eng: "Coordinate Complex Sentence 'at the same time...'. Indicates two actions taking place simultaneously.",
            examples: [
              {
                hanzi: "咱们一边吃蛋糕，一边聊天儿吧。",
                pinyin: "Zánmen yìbiān chī dàngāo, yìbiān liáotiānr ba.",
                uzb: "Kelinglar, bir vaqtning o'zida ham tort yeb, ham suhbatlashamiz."
              },
              {
                hanzi: "我喜欢一边跑步，一边听音乐。",
                pinyin: "Wǒ xǐhuan yìbiān pǎobù, yìbiān tīng yīnyuè.",
                uzb: "Men yugurish bilan birga musiqa eshitishni yaxshi ko'raman."
              },
              {
                hanzi: "你不应该边开车边打电话。",
                pinyin: "Nǐ bù yīnggāi biān kāichē biān dǎ diànhuà.",
                uzb: "Sen mashina haydab ketayotganda telefonlashmasliging kerak."
              }
            ]
          }
        ];

        const GRAMMAR_TEST_QUESTIONS = [
          { q: "明天不下雨____，我们就去爬山。", options: ["的话", "一边", "把"], answer: "的话" },
          { q: "老师____作业发给我们了。", options: ["把", "被", "的话"], answer: "把" },
          { q: "他喜欢____听音乐____写作业。", options: ["一边...一边...", "因为...所以...", "虽然...但是..."], answer: "一边...一边..." },
          { q: "明天你有时间____，我们一起去看电影。", options: ["把", "的话", "一边"], answer: "的话" },
          { q: "请你____门关上。", options: ["被", "把", "让"], answer: "把" },
          { q: "我们____走____聊吧。", options: ["一边...一边...", "把...把...", "的话...的话..."], answer: "一边...一边..." },
          { q: "菜太冷了，你____它热一下。", options: ["把", "被", "叫"], answer: "把" },
          { q: "如果你不舒服____，就去休息吧。", options: ["的话", "把", "被"], answer: "的话" },
          { q: "我____昨天买的苹果吃完了。", options: ["被", "把", "一边"], answer: "把" },
          { q: "弟弟____吃饭____看电视。", options: ["把...把...", "一边...一边...", "的话...的话..."], answer: "一边...一边..." },
          { q: "他____电脑弄坏了。", options: ["被", "把", "让"], answer: "把" },
          { q: "你想去北京____，现在就买票。", options: ["的话", "把", "一边"], answer: "的话" },
          { q: "妈妈____衣服洗干净了。", options: ["被", "把", "的话"], answer: "把" },
          { q: "我们不能____开车____打电话。", options: ["一边...一边...", "把...把...", "让...让..."], answer: "一边...一边..." },
          { q: "天气冷____，你就多穿点衣服。", options: ["的话", "把", "被"], answer: "的话" }
        ];

        const FILL_BLANKS_QUESTIONS = [
          { q: "今天我____，你们想吃什么就点什么。", answer: "请客", options: ["请客", "做法", "不同", "南方"] },
          { q: "南方菜跟北方菜的____不同。", answer: "做法", options: ["做法", "地图", "点", "晚会"] },
          { q: "咱们只点了一个鸡肉，再____几个肉菜吧。", answer: "加", options: ["加", "放", "感到", "做客"] },
          { q: "下周你们有时间____，就来我家。", answer: "的话", options: ["的话", "一边", "点", "文化"] },
          { q: "第一次请新邻居来____，有点紧张。", answer: "做客", options: ["做客", "请客", "聊天儿", "放心"] },
          { q: "这是我的新____，他们刚搬来。", answer: "邻居", options: ["邻居", "客人", "画家", "夫妻"] },
          { q: "____吧，我已经把东西准备好了。", answer: "放心", options: ["放心", "感到", "加", "放"] },
          { q: "客人来了，我去把____拿出来。", answer: "酒", options: ["酒", "盘子", "点", "地图"] },
          { q: "我把饮料和水果都____在冰箱里了。", answer: "放", options: ["放", "加", "直到", "感到"] },
          { q: "谢谢你们来参加我儿子的生日____。", answer: "晚会", options: ["晚会", "文化", "礼物", "做法"] },
          { q: "我给你准备了一个生日____，希望你喜欢。", answer: "礼物", options: ["礼物", "酒", "地图", "红茶"] },
          { q: "他喜欢画画，想做一名____。", answer: "画家", options: ["画家", "邻居", "客人", "夫妻"] },
          { q: "去把____拿过来，我们要吃蛋糕。", answer: "盘子", options: ["盘子", "点", "酒", "红茶"] },
          { q: "我们的新邻居是一对来自____的夫妻。", answer: "英国", options: ["英国", "东方", "北方", "南方"] },
          { q: "中国的茶文化里，很多人喜欢喝____。", answer: "红茶", options: ["红茶", "酒", "加", "点"] },
          { q: "他们聊得很开心，____晚上十二点才睡觉。", answer: "直到", options: ["直到", "感到", "不同", "的话"] },
          { q: "看了这部电影，我____很感动。", answer: "感到", options: ["感到", "直到", "放", "加"] },
          { q: "他们觉得____的文化很特别。", answer: "东方", options: ["东方", "英国", "南方", "北方"] },
          { q: "他家有一张世界____。", answer: "地图", options: ["地图", "点", "盘子", "晚会"] },
          { q: "上面每一个红____都是他们去过的地方。", answer: "点", options: ["点", "加", "地图", "红茶"] },
          { q: "你去外国人家做客，会不会感到____？", answer: "不同", options: ["不同", "放心", "做法", "文化"] },
          { q: "这些____都很有礼貌。", answer: "客人", options: ["客人", "邻居", "画家", "夫妻"] }
        ];

        // Helper: Text to Speech
        const speak = (text) => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-CN';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
          } else {
            console.warn("Speech synthesis not supported.");
          }
        };

        // Helper: Shuffle Array
        const shuffleArray = (array) => {
          const arr = [...array];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        };

        // --- COMPONENTS ---

        // 1. Flashcards (Yangi so'zlar)
        const Flashcards = () => {
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isFlipped, setIsFlipped] = useState(false);

          const card = VOCABULARY[currentIndex];

          const nextCard = () => {
            setIsFlipped(false);
            setTimeout(() => setCurrentIndex((prev) => (prev + 1) % VOCABULARY.length), 150);
          };

          const prevCard = () => {
            setIsFlipped(false);
            setTimeout(() => setCurrentIndex((prev) => (prev - 1 + VOCABULARY.length) % VOCABULARY.length), 150);
          };

          return (
            <div className="flex flex-col items-center py-10 w-full">
              <div className="mb-4 text-emerald-400 font-semibold tracking-wide">
                {currentIndex + 1} / {VOCABULARY.length}
              </div>
              
              <div 
                className="relative w-80 h-96 cursor-pointer"
                style={{ perspective: '1000px' }}
                onClick={() => setIsFlipped(!isFlipped)}
              >
                <div 
                  className={`absolute w-full h-full transition-transform duration-500 rounded-2xl shadow-2xl ${isFlipped ? '[transform:rotateY(180deg)]' : ''}`}
                  style={{ transformStyle: 'preserve-3d' }}
                >
                  {/* Front */}
                  <div 
                    className="absolute w-full h-full backface-hidden flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 rounded-2xl"
                    style={{ backfaceVisibility: 'hidden' }}
                  >
                    <button 
                      onClick={(e) => { e.stopPropagation(); speak(card.hanzi); }}
                      className="absolute top-4 right-4 p-3 bg-slate-700/50 hover:bg-emerald-500/30 text-emerald-400 rounded-full transition-colors"
                    >
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    </button>
                    <span className="text-7xl font-bold text-amber-400 mb-2">{card.hanzi}</span>
                  </div>

                  {/* Back */}
                  <div 
                    className="absolute w-full h-full backface-hidden flex flex-col items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 border border-emerald-500/30 rounded-2xl p-6 text-center"
                    style={{ backfaceVisibility: 'hidden', transform: 'rotateY(180deg)' }}
                  >
                     <button 
                      onClick={(e) => { e.stopPropagation(); speak(card.hanzi); }}
                      className="absolute top-4 right-4 p-3 bg-slate-700/50 hover:bg-emerald-500/30 text-emerald-400 rounded-full transition-colors"
                    >
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    </button>
                    <span className="text-3xl font-medium text-emerald-400 mb-4">{card.pinyin}</span>
                    <div className="w-full space-y-4">
                      <div className="bg-slate-700/40 p-3 rounded-xl border border-slate-600/50">
                        <p className="text-xs text-slate-400 uppercase tracking-widest mb-1">O'zbek</p>
                        <p className="text-lg text-slate-100 font-semibold">{card.uzb}</p>
                      </div>
                      <div className="bg-slate-700/40 p-3 rounded-xl border border-slate-600/50">
                        <p className="text-xs text-slate-400 uppercase tracking-widest mb-1">Русский</p>
                        <p className="text-md text-slate-200">{card.rus}</p>
                      </div>
                      <div className="bg-slate-700/40 p-3 rounded-xl border border-slate-600/50">
                        <p className="text-xs text-slate-400 uppercase tracking-widest mb-1">English</p>
                        <p className="text-md text-slate-200">{card.eng}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="flex space-x-6 mt-8">
                <button onClick={prevCard} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition shadow-lg border border-slate-700">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button onClick={nextCard} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl transition shadow-lg border border-slate-700">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
              </div>
            </div>
          );
        };

        // Generic Quiz Component
        const Quiz = ({ questions, questionTitle }) => {
          const [currentQ, setCurrentQ] = useState(0);
          const [score, setScore] = useState(0);
          const [showResult, setShowResult] = useState(false);
          const [selectedOption, setSelectedOption] = useState(null);
          const [isAnswered, setIsAnswered] = useState(false);

          const handleOptionClick = (option) => {
            if (isAnswered) return;
            setSelectedOption(option);
            setIsAnswered(true);

            if (option === questions[currentQ].answer) {
              setScore(score + 1);
            }

            setTimeout(() => {
              if (currentQ < questions.length - 1) {
                setCurrentQ(currentQ + 1);
                setSelectedOption(null);
                setIsAnswered(false);
              } else {
                setShowResult(true);
              }
            }, 1200);
          };

          const restart = () => {
            setCurrentQ(0);
            setScore(0);
            setShowResult(false);
            setSelectedOption(null);
            setIsAnswered(false);
          };

          if (showResult) {
            return (
              <div className="flex flex-col items-center justify-center p-10 bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 max-w-xl mx-auto my-10">
                <h2 className="text-3xl font-bold text-amber-400 mb-6">Natija (Result)</h2>
                <p className="text-6xl font-black text-emerald-400 mb-4">{score} / {questions.length}</p>
                <p className="text-slate-300 mb-8 text-xl">
                  {score === questions.length ? "Ajoyib! (Perfect!)" : "Yaxshi harakat! (Good job!)"}
                </p>
                <button onClick={restart} className="px-8 py-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition transform hover:scale-105">
                  Qaytadan boshlash (Restart)
                </button>
              </div>
            );
          }

          const q = questions[currentQ];

          return (
            <div className="max-w-2xl mx-auto my-10 p-8 bg-slate-800 rounded-3xl shadow-2xl border border-slate-700">
              <div className="flex justify-between items-center mb-8 pb-4 border-b border-slate-700">
                <h2 className="text-xl font-medium text-slate-400">{questionTitle}</h2>
                <span className="bg-slate-900 text-emerald-400 px-4 py-1.5 rounded-full font-bold text-sm shadow-inner">
                  {currentQ + 1} / {questions.length}
                </span>
              </div>
              
              <div className="mb-10 text-center">
                <h3 className="text-4xl md:text-5xl font-bold text-amber-400 leading-tight">
                  {q.q}
                </h3>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {q.options.map((opt, idx) => {
                  let btnClass = "bg-slate-700 hover:bg-slate-600 text-slate-200 border-slate-600";
                  if (isAnswered) {
                    if (opt === q.answer) {
                      btnClass = "bg-emerald-600/20 text-emerald-400 border-emerald-500/50 shadow-[0_0_15px_rgba(16,185,129,0.3)]";
                    } else if (opt === selectedOption) {
                      btnClass = "bg-red-900/40 text-red-400 border-red-500/50";
                    } else {
                      btnClass = "bg-slate-800 text-slate-500 border-slate-700 opacity-50";
                    }
                  }

                  return (
                    <button
                      key={idx}
                      onClick={() => handleOptionClick(opt)}
                      disabled={isAnswered}
                      className={`p-5 rounded-xl border-2 text-lg font-medium transition-all duration-300 ${btnClass}`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        };

        // 2. Vocab Test Wrapper
        const VocabTest = () => {
          const [questions, setQuestions] = useState([]);

          useEffect(() => {
            // Generate questions: Hanzi -> 4 Uzbek options
            const generated = VOCABULARY.map(v => {
              const distractors = VOCABULARY.filter(x => x.hanzi !== v.hanzi)
                                            .sort(() => 0.5 - Math.random())
                                            .slice(0, 3)
                                            .map(x => x.uzb);
              const options = shuffleArray([v.uzb, ...distractors]);
              return { q: v.hanzi, answer: v.uzb, options };
            });
            setQuestions(shuffleArray(generated));
          }, []);

          if (questions.length === 0) return null;
          return <Quiz questions={questions} questionTitle="Lug'at testi (So'zning ma'nosini toping)" />;
        };

        // 3. Dialogues (Muloqot)
        const Dialogues = () => {
          return (
            <div className="max-w-4xl mx-auto space-y-10 py-8">
              {DIALOGUES.map((dialogue, dIdx) => (
                <div key={dIdx} className="bg-slate-800 rounded-3xl shadow-xl border border-slate-700 overflow-hidden">
                  <div className="bg-slate-900 px-6 py-4 border-b border-slate-700">
                    <h3 className="text-2xl font-bold text-amber-400">{dialogue.title}</h3>
                  </div>
                  <div className="p-6 space-y-6">
                    {dialogue.lines.map((line, lIdx) => (
                      <div key={lIdx} className="flex gap-4 p-4 rounded-2xl hover:bg-slate-750 transition border border-transparent hover:border-slate-600">
                        <button 
                          onClick={() => speak(line.hanzi)}
                          className="flex-shrink-0 w-12 h-12 flex items-center justify-center bg-slate-700 hover:bg-emerald-500/20 text-emerald-400 rounded-full transition-colors"
                        >
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                        </button>
                        <div className="space-y-2 flex-1">
                          <p className="text-xl font-medium text-slate-100">{line.hanzi}</p>
                          <p className="text-md text-emerald-400">{line.pinyin}</p>
                          <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                              <span className="block text-[10px] text-slate-500 uppercase mb-1">Uzbek</span>
                              <span className="text-slate-300">{line.uzb}</span>
                            </div>
                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                              <span className="block text-[10px] text-slate-500 uppercase mb-1">Русский</span>
                              <span className="text-slate-300">{line.rus}</span>
                            </div>
                            <div className="bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                              <span className="block text-[10px] text-slate-500 uppercase mb-1">English</span>
                              <span className="text-slate-300">{line.eng}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        };

        // 4. Grammar
        const Grammar = () => {
          return (
            <div className="max-w-4xl mx-auto space-y-10 py-8">
              {GRAMMAR.map((rule, idx) => (
                <div key={idx} className="bg-slate-800 rounded-3xl shadow-xl border border-slate-700 overflow-hidden">
                  <div className="bg-emerald-900/30 px-6 py-5 border-b border-emerald-800/50">
                    <h3 className="text-2xl font-bold text-emerald-400 mb-3">{rule.title}</h3>
                    <p className="text-slate-100 mt-2 text-lg font-medium leading-relaxed tracking-wide">{rule.zh}</p>
                    
                    <div className="mt-5 space-y-2 border-t border-emerald-800/40 pt-4">
                      <p className="text-emerald-300 text-md"><span className="text-xs uppercase tracking-widest text-emerald-600 mr-2 font-bold">UZB</span> {rule.uzb}</p>
                      <p className="text-slate-400 text-sm"><span className="text-xs uppercase tracking-widest text-slate-600 mr-2 font-bold">RUS</span> {rule.rus}</p>
                      <p className="text-slate-400 text-sm"><span className="text-xs uppercase tracking-widest text-slate-600 mr-2 font-bold">ENG</span> {rule.eng}</p>
                    </div>
                  </div>
                  <div className="p-6 space-y-4">
                    <h4 className="text-amber-400 font-semibold uppercase tracking-wider text-sm mb-4">Misollar (Examples)</h4>
                    {rule.examples.map((ex, eIdx) => (
                      <div key={eIdx} className="bg-slate-900/50 p-5 rounded-2xl border border-slate-700">
                        <div className="flex gap-4">
                          <button 
                            onClick={() => speak(ex.hanzi)}
                            className="flex-shrink-0 w-10 h-10 flex items-center justify-center bg-slate-700 hover:bg-amber-500/20 text-amber-400 rounded-full transition-colors"
                          >
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                          </button>
                          <div>
                            <p className="text-xl text-slate-100 font-medium mb-1">{ex.hanzi}</p>
                            <p className="text-emerald-400 mb-2">{ex.pinyin}</p>
                            <p className="text-slate-300">{ex.uzb}</p>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          );
        };

        // 5. Grammar Test
        const GrammarTest = () => {
          return <Quiz questions={GRAMMAR_TEST_QUESTIONS} questionTitle="Grammatika testi (To'g'ri variantni tanlang)" />;
        };

        // 6. Fill in the Blanks
        const FillInBlanks = () => {
          const [questions, setQuestions] = useState([]);

          useEffect(() => {
            // Shuffle the options within each question for randomness
            const shuffled = FILL_BLANKS_QUESTIONS.map(q => ({
              ...q,
              options: shuffleArray(q.options)
            }));
            setQuestions(shuffleArray(shuffled));
          }, []);

          if (questions.length === 0) return null;
          return <Quiz questions={questions} questionTitle="So'zlarni to'ldirish (Bo'sh joyga mos so'zni qo'ying)" />;
        };

        // MAIN APP COMPONENT
        function App() {
          const [activeTab, setActiveTab] = useState('flashcards');

          const tabs = [
            { id: 'flashcards', label: "Yangi so'zlar" },
            { id: 'vocabTest', label: "Lug'at testi" },
            { id: 'dialogues', label: "Muloqot" },
            { id: 'grammar', label: "Grammatika" },
            { id: 'grammarTest', label: "Grammatika testi" },
            { id: 'fillBlanks', label: "So'zlarni to'ldirish" }
          ];

          return (
            <div className="min-h-screen flex flex-col">
              
              {/* Header */}
              <header className="bg-[#1e293b] border-b border-slate-700 pt-10 pb-6 px-4 shadow-lg sticky top-0 z-50">
                <div className="max-w-6xl mx-auto text-center space-y-3">
                  <h1 className="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-emerald-400">
                    我的新邻居来自英国
                  </h1>
                  <h2 className="text-lg md:text-xl font-medium text-slate-300">
                    Dilfuza Kāng lǎo shī bilan xitoy tilini o'rganmiz
                  </h2>
                </div>
                
                {/* Navigation */}
                <div className="max-w-6xl mx-auto mt-8 overflow-x-auto no-scrollbar">
                  <div className="flex justify-start md:justify-center space-x-2 pb-2">
                    {tabs.map(tab => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`whitespace-nowrap px-5 py-2.5 rounded-xl font-medium transition-all duration-300 ${
                          activeTab === tab.id 
                          ? 'bg-emerald-500 shadow-lg shadow-emerald-500/20 text-slate-900' 
                          : 'bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-slate-200 border border-slate-700'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>
                </div>
              </header>

              {/* Main Content */}
              <main className="flex-grow max-w-6xl mx-auto p-4 w-full">
                {activeTab === 'flashcards' && <Flashcards />}
                {activeTab === 'vocabTest' && <VocabTest />}
                {activeTab === 'dialogues' && <Dialogues />}
                {activeTab === 'grammar' && <Grammar />}
                {activeTab === 'grammarTest' && <GrammarTest />}
                {activeTab === 'fillBlanks' && <FillInBlanks />}
              </main>

              {/* Footer */}
              <footer className="bg-[#0b1120] border-t border-slate-800/50 mt-auto py-8 px-4 text-center">
                <p className="text-slate-500 text-sm font-medium">
                  HSK 3 NEW3.0 - Lesson 13
                </p>
                <p className="text-slate-600 text-xs mt-2">
                  © 2026 Dilfuza Kāng lǎo shī (telegram@diffila)
                </p>
              </footer>
            </div>
          );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
